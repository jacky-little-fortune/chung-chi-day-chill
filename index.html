<style>
/* ===== 色板（如 ../art/README.md 有指定色板，喺呢度改） ===== */
:root{
  /* 色板：來自 art/README.md */
  --cream:#FFF6E5; --paper:#FFFBF3; --card:#FBE9CF; --ink:#4A3426; --ink-soft:#7A604C;
  --orange:#E8833A; --caramel:#C9935F; --maple:#C8553D; --ginkgo:#F2B84B;
  --sage:#A9BF8E; --chestnut:#8A5A3B; --line:#8A5A3B;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink)}
body{font-family:"Noto Sans TC","PingFang TC","PingFang HK","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(rgba(138,90,59,.08) 1.2px,transparent 1.3px);background-size:14px 14px;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 16px)}
.wrap{max-width:480px;margin:0 auto}
h1,h2,h3,b,.tile b,.dot,.btn,.pill{font-family:"Zen Maru Gothic","jf-openhuninn","Hiragino Maru Gothic ProN","Noto Sans TC","PingFang TC",sans-serif}
h1,h2,h3{color:var(--chestnut);margin:.2em 0;line-height:1.3;letter-spacing:.02em}
a{color:var(--maple)}
/* 手繪感：不規則圓角 + 粗墨線 + 微傾 */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px 18px 24px 16px/18px 24px 16px 22px;
  box-shadow:3px 4px 0 rgba(90,62,43,.18);padding:14px 16px;margin:14px 0;position:relative}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px}
.back{min-width:52px;min-height:52px;border:2.5px solid var(--line);border-radius:50% 46% 52% 48%;background:var(--ginkgo);
  font-size:24px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:2px 3px 0 rgba(90,62,43,.2)}
.topbar h2{font-size:22px;flex:1}
.hero{position:relative;border:2.5px solid var(--line);border-radius:28px 22px 30px 20px/22px 30px 20px 28px;overflow:hidden;
  background:linear-gradient(170deg,#FFE3B8 0%,#F7C58E 55%,#E8A06A 100%);min-height:220px;box-shadow:3px 4px 0 rgba(90,62,43,.18)}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero .deco{position:absolute;font-size:34px;opacity:.9}
.hero{height:min(118vw,540px);background:#FFF6E5 url(assets/hero.webp) center bottom/cover no-repeat}
.hero .title{position:absolute;inset:0 0 auto 0;z-index:2;padding:18px 18px 40px;text-align:center;
  background:linear-gradient(#FFF6E5 0%,rgba(255,246,229,.92) 60%,rgba(255,246,229,0) 100%)}
.hero .title small{display:inline-block;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:2px 10px;font-size:14px;font-weight:700}
.hero .title h1{font-size:28px;margin-top:8px}
.hero .title p{margin:6px 0 0;font-weight:700;font-size:15px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;text-decoration:none;color:var(--ink);
  border:2.5px solid var(--line);border-radius:26px 20px 28px 18px/20px 28px 18px 26px;padding:12px;box-shadow:3px 4px 0 rgba(90,62,43,.2);transition:transform .12s}
.tile:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(90,62,43,.2)}
.tile:nth-child(1){background:#FBE9CF;transform:rotate(-1deg)} .tile:nth-child(2){background:#FFF0B8;transform:rotate(1deg)}
.tile:nth-child(3){background:#E3EBD6;transform:rotate(.8deg)} .tile:nth-child(4){background:#F8D3C5;transform:rotate(-.8deg)}
.tile b{font-size:20px}
.tile span.sub{font-size:13px;color:var(--ink-soft)}
.ico{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:50%;background:rgba(255,251,243,.75);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:contain}
.note{font-size:14px;color:var(--ink-soft)}
.tbd{display:inline-block;background:#FFE1D6;border:1.5px dashed var(--maple);color:var(--maple);border-radius:10px;padding:0 8px;font-size:14px;font-weight:700}
.pill{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px;background:var(--ginkgo)}
/* 路線 */
.timeline{list-style:none;padding:0;margin:0;position:relative}
.timeline:before{content:"";position:absolute;left:30px;top:20px;bottom:20px;border-left:4px dashed var(--caramel)}
.stop{display:flex;gap:12px;align-items:flex-start;margin:14px 0;position:relative}
.dot{flex:0 0 62px;height:62px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;z-index:1;line-height:1.1}
.dot small{font-size:11px}
.stop .card{margin:0;flex:1}
.walk{margin:-4px 0 -4px 74px;font-size:14px;color:var(--ink-soft)}
/* 活動地圖（主辦方代號 A–H） */
.mapfig{margin:14px 0;border:2.5px solid var(--line);border-radius:24px 18px 26px 16px/18px 26px 16px 24px;overflow:hidden;
  box-shadow:3px 4px 0 rgba(90,62,43,.18);background:var(--cream)}
.mapopen{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
.mapfig img,.mapdlg img{width:100%;height:auto;display:block}
.mapfig figcaption{padding:8px 12px 10px}
.mapdlg{border:none;padding:0;width:min(960px,100vw);max-width:100vw;max-height:100dvh;background:var(--cream);overflow:auto}
.mapdlg::backdrop{background:rgba(74,52,38,.55)}
.mapdlgbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);z-index:2}
.badge{flex:0 0 36px;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;line-height:1;color:#fff;background:#2F9E4B}
.badge.sm{flex-basis:28px;width:28px;height:28px;font-size:15px;margin-right:4px;vertical-align:-7px}
.badge.sq{border-radius:8px}
.badge.green{background:#2F9E4B;color:#fff}
.badge.yellow{background:#F0C43A;color:var(--ink)}
.badge.orange{background:#E36B32;color:#fff}
.badge.brown{background:#C4843C;color:#fff}
.badge.tea{background:var(--ginkgo);color:var(--ink)}
.pkey{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:inherit;padding:8px 0;border-bottom:2px dotted rgba(90,62,43,.25)}
.pkey:last-child{border-bottom:0}
.pkey .body{flex:1;min-width:0}
.pkey b{font-size:16px}
.tag{display:inline-block;margin:3px 4px 0 0;border:1.5px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;background:var(--paper)}
.tag.go{background:#FFE6A8}
.ess{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ess .row{display:flex;gap:8px;align-items:flex-start}
.ess .k{flex:0 0 auto;margin-top:2px}
/* 活動 */
.evlist a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-height:84px}
.evlist .thumb{flex:0 0 88px;height:66px;border-radius:18px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.evlist .thumb img{width:100%;height:100%;object-fit:cover}
.evlist .meta{flex:1}
.evlist .arrow{font-size:26px;font-weight:700}
.evhero{aspect-ratio:4/3;border-radius:24px 18px 26px 16px/18px 26px 16px 24px;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:84px;overflow:hidden;box-shadow:3px 4px 0 rgba(90,62,43,.18)}
.evhero img{width:100%;height:100%;object-fit:cover}
dl.facts{margin:0} dl.facts dt{font-weight:700;color:var(--chestnut);margin-top:8px} dl.facts dd{margin:0}
ul.list{padding-left:1.2em;margin:.3em 0} ul.list li{margin:.25em 0}
/* 天氣 */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;gap:12px;align-items:center;background:var(--paper);border:2.5px solid var(--line);border-radius:20px 16px 22px 14px/16px 22px 14px 20px;padding:10px 12px}
.day.hl{background:#FFE6A8;box-shadow:0 0 0 4px var(--orange)}
.day .wx{font-size:40px;flex:0 0 52px;text-align:center}
.day .d{flex:1} .day .d b{font-size:17px} .day .t{font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
.err{background:#FFE1D6;border-color:var(--maple)}
/* 物資 */
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-bottom:2px dotted rgba(90,62,43,.25);cursor:pointer;user-select:none}
.check:last-child{border-bottom:0}
.box{flex:0 0 34px;height:34px;border:2.5px solid var(--line);border-radius:10px 8px 11px 7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.check.on .box{background:var(--sage)} .check.on .box:after{content:"✓";color:var(--ink);font-weight:700}
.check.on .lbl{text-decoration:line-through;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border:2.5px solid var(--line);border-radius:18px;background:var(--ginkgo);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;box-shadow:2px 3px 0 rgba(90,62,43,.2)}
.foot{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:22px}
.leaf{position:fixed;pointer-events:none;font-size:22px;opacity:.5;z-index:0}
.view{position:relative;z-index:1;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

<script>

 */

/* ===================================================== */

    map:"C",

    tips:["4:00pm 要準時，冇逾時等候，建議提早由前一站出發。","手繩要好好保管，入場要憑手繩。","上色可能整污手，帶濕紙巾。"] }

const ROUTE = [
  { t:"2:00", end:"2:45pm", ev:"tea", hint:"" },
  { t:"3:00", end:"6:00pm", ev:"chillclub", hint:"一到先攞雪糕（限量 200 杯，派完即止）", walk:"同一棟，由地下飯堂上到一樓體育館（地圖 C）" },

];

/* 主辦方《七十周年院慶校友日活動地圖》代號。star = 詢問處，stamp = 集章處。 */
const PLACES = [
  { code:"A", name:"蔡繼有宿舍", where:"", star:true, stamp:true, tone:"green", shape:"circle" },
  { code:"B", name:"聯合書院水塔", where:"", star:true, stamp:true, tone:"yellow", shape:"square" },
  { code:"C", name:"張煊昌體育館", where:"張祝珊師生康樂大樓一樓", star:true, stamp:true, tone:"green", shape:"circle", ev:"chillclub" },

  { code:"F", name:"乒乓球室及健身室", where:"張祝珊師生康樂大樓一樓", star:false, stamp:false, tone:"orange", shape:"square" },
  { code:"G", name:"L+", where:"曾肇添樓 407 室", star:false, stamp:false, tone:"orange", shape:"circle", ev:"cat" },
  { code:"H", name:"思源文娛中心", where:"鄭棟材樓", star:false, stamp:true, tone:"brown", shape:"circle" }
];

const CHECKLIST = [
  ["🧥","外套（秋天早晚涼）"],["💧","水"],["🧻","濕紙巾"],["🧣","小毛巾"],["👕","後備衫（玩彈床會出汗）"],
  ["🧴","防曬"],["🦟","防蚊用品"],["📷","相機／手機（影家庭照）"],["📧","確認電郵／報名證明"],["🎟️","手繩、雪糕券（領取後好好保管）"]
];

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
// 圖片：有就顯示，冇就保留 emoji fallback
function art(file, emoji, alt){
  return `<span class="fb">${emoji}</span><img src="${CONFIG.artBase}${file}" alt="${esc(alt||"")}" loading="lazy"
    onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.remove()">`;
}
const ev = id => EVENTS.find(e => e.id === id);
const placeByCode = code => PLACES.find(p => p.code === code);
function placeText(e){
  if(e.map){
    const p = placeByCode(e.map);
    return `${p.code} ${p.name}${p.where ? "（" + p.where + "）" : ""}`;
  }
  return e.place;
}
function placeMeta(e){
  if(e.orient) return e.orient;
  if(!e.map) return "";
  const p = placeByCode(e.map);
  const bits = [];
  if(p.star) bits.push("設有詢問處");
  if(p.stamp) bits.push("集章處");
  return bits.join(" · ");
}
function badge(code, tone, shape, sm){
  return `<span class="badge ${tone}${shape==="square"?" sq":""}${sm?" sm":""}">${code}</span>`;
}
function eventBadge(e, sm){
  if(e.map){ const p = placeByCode(e.map); return badge(p.code, p.tone, p.shape, sm); }
  return badge("茶", "tea", "circle", sm);
}
function topBar(title, back){ return `<div class="topbar"><a class="back" href="${back||"#/"}" aria-label="返回">‹</a><h2>${title}</h2></div>`; }
function eventWhen(){
  const d = CONFIG.eventDate.replace(/-/g,"");
  const dt = new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8));
  return `${+d.slice(0,4)}年${+d.slice(4,6)}月${+d.slice(6,8)}日（星期${"日一二三四五六"[dt.getDay()]}）2:00–6:00pm`;
}

    <a class="tile" href="#/weather"><span class="ico">${art("icon-weather.webp","⛅")}</span><b>天氣預測</b><span class="sub">天文台九天預報</span></a>
    <a class="tile" href="#/checklist"><span class="ico">${art("icon-checklist.webp","🎒")}</span><b>預備物資</b><span class="sub">出門前剔一剔</span></a>
  </nav>
  <p class="foot">資料來源：聯合書院確認報名電郵、七十周年院慶校友日活動地圖｜如有更改以主辦方公佈為準</p>`;
}

function todayRows(){
  const rows = [
    { id:"tea", sub:"2:00–2:45 · 康樂大樓地下飯堂（與 C、F 同一棟）" },
    { id:"chillclub", sub:"3:00–6:00 · 張煊昌體育館" },
    { id:"photo", sub:"3:00–6:00 · 天機數碼創意空間" },
    { id:"cat", sub:"4:00–6:00 · 曾肇添樓 L+ 407" }
  ];
  return rows.map(r => {
    const e = ev(r.id);
    return `<a class="pkey" href="#/event/${e.id}">${eventBadge(e)}<span class="body"><b>${esc(e.short)}</b><div class="note">${esc(r.sub)}</div></span></a>`;
  }).join("");
}
function placeRows(){
  return PLACES.map(p => {
    const tags = [
      p.star ? `<span class="tag">詢問處</span>` : "",
      p.stamp ? `<span class="tag">集章</span>` : "",
      p.ev ? `<span class="tag go">今日</span>` : ""
    ].join("");
    const inner = `${badge(p.code, p.tone, p.shape)}<span class="body"><b>${esc(p.name)}</b>${p.where ? `<div class="note">${esc(p.where)}</div>` : ""}<div>${tags}</div></span>`;
    return p.ev ? `<a class="pkey" href="#/event/${p.ev}">${inner}</a>` : `<div class="pkey">${inner}</div>`;
  }).join("");
}
function route(){
  const stops = ROUTE.map(r => {
    const e = ev(r.ev);
    return `${r.walk ? `<div class="walk">🚶 ${esc(r.walk)}</div>` : ""}
    <li class="stop"><div class="dot" style="background:${e.color}">${r.t}<small>pm</small></div>
      <a class="card" href="#/event/${e.id}" style="text-decoration:none;color:inherit;display:block">
        <b>${eventBadge(e, true)} ${esc(e.short)}</b><div class="note">${esc(r.t)} – ${esc(r.end)}</div>
        <div>📍 ${esc(placeText(e))}</div>${r.hint ? `<div style="margin-top:4px;font-weight:700;color:var(--maple)">⭐ ${esc(r.hint)}</div>` : ""}
      </a></li>`;
  }).join("");
  const alt = "聯合書院七十周年院慶校友日活動地圖。A 至 H 是官方地點；橙色標示今日家庭行程：下午茶在康樂大樓地下、C 體育館、D 天機數碼創意空間、G 曾肇添樓 L+。";
  return `${topBar("規劃路線")}
  <p class="note" style="margin:4px 0 0">${eventWhen()} · 七十周年院慶校友日</p>
  <figure class="mapfig">
    <button type="button" class="mapopen" id="openmap" aria-label="放大活動地圖">
      <img src="assets/campus-map.webp" width="1200" height="1908" alt="${esc(alt)}">
    </button>
    <figcaption class="note">方位、代號同名稱依照主辦方《活動地圖》。撳圖可以放大。</figcaption>
  </figure>
  <dialog class="mapdlg" id="mapdlg">
    <div class="mapdlgbar"><button type="button" class="back" id="closemap" aria-label="關閉">×</button><b>活動地圖</b></div>
    <img src="assets/campus-map.webp" alt="${esc(alt)}">
  </dialog>
  <div class="card"><b>今日行程</b>${todayRows()}</div>
  <div class="card"><b>校園須知</b><div class="ess">
    <div class="row"><span class="k pill">集章</span><span>A 蔡繼有宿舍、B 水塔、C 體育館、D 天機數碼、E 演講廳、H 思源</span></div>
    <div class="row"><span class="k pill">詢問處</span><span>A、B、C、D、E（活動地圖帶 *）</span></div>
    <div class="row"><span class="k pill">專車</span><span>5:15–6:15pm 往大學站（康樂大樓一側，地圖巴士圖示）</span></div>
    <div class="row"><span class="k pill">泊車</span><span>訪客停車場（地圖藍色 P）</span></div>
    <div class="row"><span class="k pill">急救</span><span>急救站在張祝珊師生康樂大樓旁（綠色十字）</span></div>
    <div class="row"><span class="k pill">紀念品</span><span>七十周年紀念品售賣攤位（胡忠圖書館／D 附近）</span></div>
  </div></div>
  <div class="card"><b>活動地圖代號 A–H</b>${placeRows()}</div>
  <div class="card"><b>🚇 點去、點返</b>
    <div>去：港鐵大學站 → 校巴往聯合書院</div>
    <div>返：5:15–6:15pm 專車往大學站</div>
    <div class="note">專車上落客站見地圖巴士圖示。校巴班次請現場留意指示。</div>
  </div>
  <ol class="timeline">${stops}</ol>
  <div class="card"><b>📝 小提示</b><ul class="list">
    <li>2:45 茶聚完，上同一棟一樓就到 C。雪糕限量，先攞。</li>
    <li>3:00–6:00 C Chill Club 同 D 攝影區一齊開放，可以自由安排。</li>
    <li>4:00 G 曾肇添樓 L+ 407 不設逾時等候，由 D 行過去要預留時間。</li>
    <li>想集章可以順路蓋 C 同 D；A、B、E、H 有空先去。</li></ul></div>`;
}

function events(){
  return `${topBar("活動介紹")}
  <div class="evlist">${EVENTS.map(e => `
    <div class="card" style="padding:10px 12px"><a href="#/event/${e.id}">
      <span class="thumb" style="background:${e.color}">${art(e.art, e.emoji)}</span>
      <span class="meta"><b>${eventBadge(e, true)} ${esc(e.short)}</b><br><span class="note">🕑 ${esc(e.time)}</span><br><span class="note">📍 ${esc(placeText(e))}</span></span>
      <span class="arrow">›</span></a></div>`).join("")}</div>`;
}

function eventPage(id){
  const e = ev(id); if(!e) return events();
  const li = a => `<ul class="list">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `${topBar(esc(e.short), "#/events")}
  <div class="evhero" style="background:${e.color}">${art(e.art, e.emoji, e.name)}</div>
  <div class="card"><h3>${esc(e.name)}</h3>
    <dl class="facts">
      <dt>🕑 時間</dt><dd>${esc(e.time)}</dd>
      <dt>📅 日期</dt><dd>${CONFIG.eventDate ? fmtDate(CONFIG.eventDate) : '<span class="tbd">待確認</span>'}</dd>
      <dt>📍 地點</dt><dd>${esc(placeText(e))}${placeMeta(e) ? `<div class="note">${esc(placeMeta(e))}</div>` : ""}</dd>
    </dl></div>
  <div class="card"><b>🎨 內容</b>${li(e.content)}</div>
  <div class="card" style="background:#FFF0E0"><b>⚠️ 注意事項</b>${li(e.notes)}</div>
  <div class="card" style="background:#EEF5E8"><b>👨‍👩‍👧 親子小貼士</b>${li(e.tips)}</div>`;
}

function checklist(){
  const saved = JSON.parse(localStorage.getItem("ccd-check") || "[]");
  return `${topBar("預備物資")}
  <div class="card"><p class="note" style="margin:0 0 6px">秋天戶外＋小朋友，出門前逐樣剔一剔（會記住喺呢部手機）。</p>
  ${CHECKLIST.map((c,i)=>`<div class="check ${saved.includes(i)?"on":""}" role="checkbox" aria-checked="${saved.includes(i)}" tabindex="0" data-i="${i}">
    <span class="box"></span><span style="font-size:24px">${c[0]}</span><span class="lbl">${esc(c[1])}</span></div>`).join("")}
  </div><div style="text-align:center"><button class="btn" id="reset">↺ 全部重設</button></div>`;
}

/* ---------- 天氣 ---------- */
function fmtDate(s){ // "2026-11-08" or "20261108"
  const d = s.replace(/-/g,""); return `${+d.slice(0,4)}年${+d.slice(4,6)}月${+d.slice(6,8)}日`;
}
function wxEmoji(icon){
  icon = +icon;
  if([50].includes(icon)) return "☀️"; if([51].includes(icon)) return "🌤️"; if([52].includes(icon)) return "⛅";
  if([53,54].includes(icon)) return "🌦️"; if([60,61].includes(icon)) return "☁️"; if([62,63].includes(icon)) return "🌧️";
  if([64,65].includes(icon)) return "⛈️"; if([76,77].includes(icon)) return "🌤️"; if([80,81,82,83,84,85].includes(icon)) return "🌬️";
  if([90,91].includes(icon)) return "🥵"; if([92,93].includes(icon)) return "🥶"; return "🌈";
}
function weatherShell(){
  return `${topBar("天氣預測")}
  <div class="card"><b>📅 活動日期：</b>${CONFIG.eventDate ? fmtDate(CONFIG.eventDate) : '<span class="tbd">待確認</span>'}
    <div class="note">${CONFIG.eventDate ? "已設定日期，預報範圍內會用橙框標示。" : `日期未確認，先顯示未來 ${CONFIG.daysToShowWhenNoDate} 日預報。`}</div></div>
  <div id="wx"><div class="card">⏳ 正在讀取天文台九天天氣預報…</div></div>
  <p class="foot">資料來源：<a href="${CONFIG.hkoPage}" target="_blank" rel="noopener">香港天文台</a>九天天氣預報</p>`;
}
async function loadWeather(){
  const box = document.getElementById("wx");
  try{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 12000);
    const r = await fetch(CONFIG.hkoApi, {signal:ctl.signal, cache:"no-store"}); clearTimeout(to);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(); const list = j.weatherForecast || [];
    if(!list.length) throw new Error("no data");
    if(!document.getElementById("wx")) return;
    const target = CONFIG.eventDate.replace(/-/g,"");
    let days, msg = "";
    if(target){
      const inRange = list.some(d => d.forecastDate === target);
      days = list;
      if(!inRange) msg = `<div class="card" style="background:#FFF0E0">活動日（${fmtDate(target)}）未進入／已超出天文台九天預報範圍，以下為現時九天預報，請稍後再查。</div>`;
    } else days = list.slice(0, CONFIG.daysToShowWhenNoDate);
    box.innerHTML = msg + (j.generalSituation ? `<div class="card"><b>🌏 天氣概況</b><div style="font-size:15px">${esc(j.generalSituation)}</div></div>` : "") +
      `<div class="days">${days.map(d => `
        <div class="day ${d.forecastDate===target?"hl":""}">
          <span class="wx">${wxEmoji(d.ForecastIcon)}</span>
          <span class="d"><b>${+d.forecastDate.slice(4,6)}月${+d.forecastDate.slice(6,8)}日 ${esc(d.week)}</b>${d.forecastDate===target?' <span class="pill">活動日</span>':""}
            <div style="font-size:14px">${esc(d.forecastWeather)}</div>
            <div class="note">${esc(d.forecastWind)}｜降雨概率：${esc(d.PSR||"-")}</div></span>
          <span class="t">${d.forecastMintemp.value}–${d.forecastMaxtemp.value}°C<div class="note" style="font-weight:400">濕度 ${d.forecastMinrh.value}–${d.forecastMaxrh.value}%</div></span>
        </div>`).join("")}</div>
      <p class="note" style="text-align:center">更新時間：${j.updateTime ? new Date(j.updateTime).toLocaleString("zh-HK",{hour12:false}) : "-"}</p>`;
  }catch(e){
    if(!document.getElementById("wx")) return;
    box.innerHTML = `<div class="card err"><b>😿 暫時讀取唔到天氣預報</b>
      <p style="margin:6px 0">請檢查網絡，或直接去天文台網站查看。</p>
      <a class="btn" href="${CONFIG.hkoPage}" target="_blank" rel="noopener">請查天文台 ›</a>
      <button class="btn" style="background:var(--paper);margin-left:8px" onclick="loadWeather()">再試一次</button></div>`;
  }
}

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#\/?/, "");
  const [p, id] = h.split("/");
  let html;
  switch(p){
    case "route": html = route(); break;
    case "events": html = events(); break;
    case "event": html = eventPage(id); break;
    case "weather": html = weatherShell(); break;
    case "checklist": html = checklist(); break;
    default: html = home();
  }
  $app.innerHTML = `<div class="view">${html}</div>`;
  window.scrollTo(0,0);
  if(p === "weather") loadWeather();
  if(p === "route"){
    const dlg = document.getElementById("mapdlg");
    const open = document.getElementById("openmap");
    const close = document.getElementById("closemap");
    if(open && dlg && close){
      open.onclick = () => dlg.showModal();
      close.onclick = () => dlg.close();
      dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });
    }
  }
  if(p === "checklist"){
    const toggle = el => {
      const i = +el.dataset.i; let s = JSON.parse(localStorage.getItem("ccd-check") || "[]");
      s = s.includes(i) ? s.filter(x=>x!==i) : [...s, i]; localStorage.setItem("ccd-check", JSON.stringify(s));
      el.classList.toggle("on"); el.setAttribute("aria-checked", s.includes(i));
    };
    document.querySelectorAll(".check").forEach(el => { el.onclick = () => toggle(el); el.onkeydown = e => { if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(el);} }; });
    document.getElementById("reset").onclick = () => { localStorage.removeItem("ccd-check"); render(); };
  }
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
