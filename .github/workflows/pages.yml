name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make the repository public and enable branch Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "--- visibility ---"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f private=false -f visibility=public
          echo "--- legacy pages source ---"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"main","path":"/"}}
          EOF
          echo "--- repo ---"
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{private:.private,visibility:.visibility,has_pages:.has_pages}'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
